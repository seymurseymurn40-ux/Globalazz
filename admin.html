<!DOCTYPE html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlobalAz Admin</title>
<style>
:root{--bg:#F6F6F4;--sf:#fff;--ink:#1C1B1A;--mu:#6B6862;--ln:#E6E3DE;--or:#F2620F;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{background:#010101;color:#fff;display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}header b{margin-right:auto;font-size:17px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 12px;background:var(--or);color:#fff;font-weight:700}
button.g{background:#fff;color:var(--ink);border:1px solid var(--ln)}button.r{background:#E11D48}header button{background:#333}header button.on{background:var(--or)}
main{max-width:980px;margin:0 auto;padding:14px}.c{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--ink)}
label{display:grid;gap:3px;font-size:13px;color:var(--mu);font-weight:600;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}.row>*{flex:1 1 140px;margin:0}.row>button{flex:0 0 auto}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--ln);flex-wrap:wrap}.it>div{flex:1;min-width:160px}
.it img,.ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#eee;flex:none}small,.zh{color:var(--mu);font-size:13px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1C1B1A;color:#fff;padding:9px 16px;border-radius:99px;display:none;z-index:9}[hidden]{display:none!important}
#splash{position:fixed;inset:0;z-index:200;background:#010101;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#splash img{width:min(100vw,100vh);height:min(100vw,100vh);object-fit:contain;display:block}
#splash.off{opacity:0;pointer-events:none}
#splash .skp{position:absolute;right:16px;top:16px;top:calc(env(safe-area-inset-top,0px) + 16px);z-index:2;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:8px 18px;font:600 14px system-ui,sans-serif;cursor:pointer}
#lg{position:fixed;inset:0;z-index:150;background:#010101;color:#fff;overflow:auto;display:flex;padding:20px;margin:0!important;max-width:none!important;border:0;border-radius:0}
#lg .box{width:min(380px,100%);margin:auto;display:grid;gap:12px}
#lg .lgi{width:130px;height:130px;object-fit:cover;border-radius:50%;margin:0 auto;display:block}
#lg h2{margin:0;text-align:center;font-size:22px}#lg .sb{margin:0;text-align:center;color:#FFB070;font-size:14px}
#lg .pwr{position:relative}#lg input{background:#1F1D1A;border:1px solid #34312D;color:#fff;padding:13px;border-radius:12px;font-size:16px}
#lg .pwr button{position:absolute;right:4px;top:4px;background:transparent;font-size:20px;padding:6px 10px}
#lg .go{border-radius:99px;padding:13px;font-size:16px}
#lg .alt{background:transparent;border:1px solid #4a4640;color:#fff}
</style></head><body>

<section id="s_s" class="c"><h3 style="margin-top:0">Tənzimləmələr</h3><div class="row"><label>1 ¥ = ? ₼<input id="x_rate" type="number" step="0.001"></label><label>Marja %<input id="x_margin" type="number" step="0.1"></label><label>Karqo ₼/kq<input id="x_cargo" type="number" step="0.01"></label><label>Gömrük %<input id="x_cust" type="number" step="0.1"></label></div>
<div class="row"><label>WhatsApp nömrəsi (994...)<input id="x_wa"></label></div><button onclick="ss()">Yadda saxla</button>
<hr><div class="row"><label>Yeni admin parolu (min. 6 simvol)<input id="x_pw" type="password"></label><button onclick="cpw()">Parolu dəyiş</button></div>
<hr><h3 style="margin-top:0">Taobao API testi</h3><div class="row"><label>Məhsul linki<input id="tl" placeholder="https://item.taobao.com/item.htm?id=..."></label><button onclick="tt()">Test et</button></div><pre id="tres" style="white-space:pre-wrap;word-break:break-all;max-height:320px;overflow:auto;font-size:12px"></pre></section><section id="s_p"></section>
<section id="s_a" class="c"><h3 style="margin-top:0" id="ft">Yeni məhsul</h3>
<div class="row"><label>Taobao / 1688 linki<input id="lk" placeholder="https://item.taobao.com/item.htm?id=..."></label><button onclick="fl()">Linkdən gətir</button></div>
<label>Çin dilində ad (orijinal)<textarea id="zh" rows="2"></textarea></label>
<div class="row"><button class="g" onclick="tz()">Çincədən Azərbaycan dilinə tərcümə et ↓</button></div>
<label>Azərbaycan dilində ad (saytda görünəcək)<textarea id="az" rows="2"></textarea></label>
<div class="row"><label>Kateqoriya<select id="cat"></select></label><label>Şəkil linki<input id="im"></label></div>
<div class="row"><label>Qiymət (¥ CNY)<input id="cn" type="number" step="0.01" oninput="pv()"></label><label>Çəki (kq)<input id="kg" type="number" step="0.01" value="0.5" oninput="pv()"></label><label>Öz qiymətim (₼, istəyə bağlı)<input id="pr" type="number" step="0.01" oninput="pv()"></label></div>
<label>Təsvir (Azərbaycan dilində; Çin mətnini yapışdırıb tərcümə də edə bilərsiniz)<textarea id="ds" rows="3"></textarea></label><div class="row"><button class="g" onclick="td()">Təsvirı Çincədən tərcümə et</button></div>
<label>Əlavə şəkillər (hər sətirdə bir link)<textarea id="ims" rows="2"></textarea></label>
<label>Variantlar (hər sətir: Ad: dəyər1, dəyər2) — məs. Rəng: Qara, Ağ<textarea id="op" rows="2"></textarea></label>
<p>Saytda qiymət: <b id="pvv">—</b></p><button onclick="sv()">Saytda yerləşdir</button> <button class="g" onclick="rs()">Təmizlə</button></section>
</main></div><div id="msg"></div>
<script>
function skipSplash(){const s=document.getElementById('splash');if(s&&!s.classList.contains('off')){s.classList.add('off');setTimeout(()=>s.remove(),600)}}
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const STS={new:'Yeni',ordered:'Sifariş verildi',shipped:'Yolda',done:'Çatdırıldı',cancel:'Ləğv edildi'},PAY={none:'Ödənilməyib',adv:'Avans alınıb',paid:'Ödənilib'};
const CATS=["Qadın geyimləri","Kişi geyimləri","Ayaqqabı","Çanta və aksesuar","Gözəllik və baxım","Telefon və rəqəmsal","Məişət texnikası","Ev və dekor","Mətbəx","Ana və uşaq","Oyuncaqlar","İdman və turizm","Avto məhsulları","Zinət və saatlar","Ev heyvanları","Kitab və hobbi","Digər"];
$('lgi').src=document.querySelector('#splash img').src;setTimeout(()=>{const s=$('splash');if(!s)return;s.classList.add('off');setTimeout(()=>s.remove(),600)},3000);
let T=localStorage.getItem('ga_t')||'',CFG={rate:.24,margin:12,cargo:6,cust:5},PR=[],OR=[],ED=null;
function msg(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',Math.max(2800,t.length*80))}
async function api(p,o={}){const r=await fetch('/api'+p,{method:o.method||'GET',headers:{'Content-Type':'application/json','x-token':T},body:o.body?JSON.stringify(o.body):undefined}),j=await r.json().catch(()=>({}));
 if(r.status===401&&T){logout()}if(!r.ok)throw new Error(j.error||('Xəta '+r.status));return j}
async function login(){try{T=(await api('/login',{method:'POST',body:{password:$('pw').value}})).token;localStorage.setItem('ga_t',T);start()}catch(e){msg(e.message)}}
function logout(){T='';localStorage.removeItem('ga_t');$('lg').hidden=false;$('ap').hidden=true}
async function start(){try{CFG=(await fetch('/api/products').then(r=>r.json())).cfg;PR=(await api('/admin/products')).list;OR=(await api('/orders')).list}catch(e){msg('Panel açılmadı: '+e.message);return}
 $('lg').hidden=true;$('ap').hidden=false;$('cat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');ro();rp();rh();ls();tab('o')}
function tab(t){for(const k of['o','p','a','h','s']){$('s_'+k).hidden=k!==t;$('t_'+k).className=k===t?'on':''}}
const fp=p=>p.pr>0?p.pr:((p.cny*CFG.rate)*(1+CFG.margin/100)+p.kg*CFG.cargo)*(1+CFG.cust/100);
const wa=p=>{let d=p.replace(/\D/g,'');if(d[0]==='0')d='994'+d.slice(1);return d};
const im=u=>u?`<img src="${esc(u)}" referrerpolicy="no-referrer" alt="">`:'<span class="ph"></span>';
const sel=(id,o,v)=>`<select id="${id}">${Object.entries(o).map(([k,l])=>`<option value="${k}"${k===v?' selected':''}>${l}</option>`).join('')}</select>`;
function ro(){const q=($('qs').value||'').toLowerCase(),f=$('fs').value;
 const L=OR.filter(o=>(!f||o.status===f)&&(!q||(o.no+o.name+o.phone+(o.email||'')+o.items.map(i=>i.n).join(' ')).toLowerCase().includes(q)));
 $('ol').innerHTML=L.length?L.map(o=>`<div class="c"><div><b>${esc(o.no)}</b> <small>${new Date(o.date).toLocaleString('az')}</small><br>👤 ${esc(o.name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a> · <a target="_blank" href="https://wa.me/${wa(o.phone)}">WhatsApp</a>${o.email?`<br>✉️ ${esc(o.email)}`:''}<br>📍 ${esc(o.address)}</div>
${o.items.map(i=>`<div class="it">${im(i.img)}<div>${esc(i.n)}${i.opt?` · <b>${esc(i.opt)}</b>`:''} × ${i.q}<div class="zh">${esc(i.zh)}</div><small>${(i.u*i.q).toFixed(2)} ₼</small></div>
${i.link?`<a href="${esc(i.link)}" target="_blank" rel="noopener"><button class="g">Link ↗</button></a><button class="g" onclick="cp('${esc(i.link)}')">Kopyala</button><button onclick="gt('${esc(i.link)}')">Məhsulu gətir</button>`:'<small>Link yoxdur</small>'}</div>`).join('')}
<div class="row" style="margin-top:8px"><label>Status${sel('s_'+o.id,STS,o.status)}</label><label>Ödəniş${sel('p_'+o.id,PAY,o.pay||'none')}</label><label>İzləmə nömrəsi<input id="t_${o.id}" value="${esc(o.track||'')}"></label><label>Real xərc ₼<input id="c_${o.id}" type="number" step="0.01" value="${o.cost||''}"></label></div>
<div class="row"><label>Qeyd<input id="n_${o.id}" value="${esc(o.note||'')}"></label><button onclick="savO('${o.id}')">Yadda saxla</button></div>
<b>Cəmi: ${o.total.toFixed(2)} ₼</b>${o.cost?` · Mənfəət: <b>${(o.total-o.cost).toFixed(2)} ₼</b>`:''}</div>`).join(''):'<p>Sifariş tapılmadı.</p>'}
async function savO(id){const g=k=>$(k+'_'+id).value,d={status:g('s'),pay:g('p'),track:g('t'),cost:+g('c')||0,note:g('n')};try{await api('/orders/'+id,{method:'PATCH',body:d});Object.assign(OR.find(x=>x.id===id),d);rh();msg('Yadda saxlandı')}catch(e){msg(e.message)}}
function csv(){const R=[['Nömrə','Tarix','Ad','Telefon','Ünvan','Məhsullar','Cəmi ₼','Xərc ₼','Mənfəət ₼','Status','Ödəniş','İzləmə']].concat(OR.map(o=>[o.no,o.date.slice(0,10),o.name,o.phone,o.address,o.items.map(i=>i.n+(i.opt?' ('+i.opt+')':'')+' x'+i.q).join('; '),o.total.toFixed(2),o.cost||0,o.cost?(o.total-o.cost).toFixed(2):'',STS[o.status]||o.status,PAY[o.pay||'none'],o.track||'']));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+R.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='sifarisler.csv';a.click()}
function rh(){const a=OR.filter(o=>o.status!=='cancel'),m={};a.forEach(o=>{const k=o.date.slice(0,7);m[k]=m[k]||{n:0,t:0,c:0,p:0};m[k].n++;m[k].t+=o.total;if(o.cost){m[k].c+=o.cost;m[k].p+=o.total-o.cost}});
 const S=f=>Object.values(m).reduce((x,y)=>x+y[f],0);
 $('s_h').innerHTML=`<h3 style="margin-top:0">Hesabat</h3><p>Sifariş: <b>${a.length}</b> · Dövriyyə: <b>${S('t').toFixed(2)} ₼</b> · Xərc: <b>${S('c').toFixed(2)} ₼</b> · Mənfəət: <b>${S('p').toFixed(2)} ₼</b><br><small>Mənfəət yalnız "real xərc" daxil edilmiş sifarişlər üzrə hesablanır. Ləğv edilənlər sayılmır.</small></p>
 <p>Yeni: ${a.filter(o=>o.status==='new').length} · Yolda: ${a.filter(o=>o.status==='shipped').length} · Çatdırılıb: ${a.filter(o=>o.status==='done').length} · Ödənilməyib: ${a.filter(o=>!o.pay||o.pay==='none').length}</p>
 <table style="width:100%;text-align:left"><tr><th>Ay</th><th>Sifariş</th><th>Dövriyyə</th><th>Mənfəət</th></tr>${Object.entries(m).sort().reverse().map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${v.t.toFixed(2)} ₼</td><td>${v.p.toFixed(2)} ₼</td></tr>`).join('')}</table>`}
async function ls(){try{const j=await api('/admin/settings');for(const k of['rate','margin','cargo','cust','wa'])$('x_'+k).value=j[k]??''}catch(e){}}
async function ss(){const b={};for(const k of['rate','margin','cargo','cust','wa'])b[k]=$('x_'+k).value;try{await api('/admin/settings',{method:'PUT',body:b});CFG=(await fetch('/api/products').then(r=>r.json())).cfg;rp();msg('Yadda saxlandı')}catch(e){msg(e.message)}}
async function cpw(){try{await api('/admin/password',{method:'POST',body:{password:$('x_pw').value}});$('x_pw').value='';msg('Parol dəyişdirildi')}catch(e){msg(e.message)}}
async function td(){const t=$('ds').value.trim();if(!t)return;try{$('ds').value=(await api('/translate',{method:'POST',body:{text:t}})).text}catch(e){msg(e.message)}}
function rp(){$('s_p').innerHTML=PR.length?`<div class="c">${PR.map(p=>`<div class="it">${im(p.img)}<div><b>${esc(p.az||p.zh)}</b><div class="zh">${esc(p.zh)}</div><small>${esc(p.c)} · ${p.cny} ¥ → ${fp(p).toFixed(2)} ₼</small></div><button class="g" onclick="ed('${p.id}')">Redaktə</button><button class="r" onclick="dl('${p.id}')">Sil</button></div>`).join('')}</div>`:'<p>Məhsul yoxdur. "+ Məhsul əlavə et" bölməsindən başlayın.</p>'}
async function setSt(id,v){try{await api('/orders/'+id,{method:'PATCH',body:{status:v}});msg('Status yeniləndi')}catch(e){msg(e.message)}}
function cp(l){navigator.clipboard.writeText(l).then(()=>msg('Link kopyalandı'),()=>prompt('Linki kopyalayın:',l))}
async function gt(l){rs();tab('a');$('lk').value=l;await fl()}
async function fl(){const l=$('lk').value.trim();if(!l)return msg('Link daxil edin');msg('Gətirilir…');
 try{const j=await api('/fetch',{method:'POST',body:{url:l}});$('lk').value=j.link;if(j.title){$('zh').value=j.title;await tz()}if(j.img)$('im').value=j.img;if(j.cny)$('cn').value=j.cny;if(j.imgs&&j.imgs.length)$('ims').value=j.imgs.join('\n');if(j.opts&&j.opts.length)$('op').value=j.opts.map(o=>o.n+': '+o.v.join(', ')).join('\n');if(j.desc)$('ds').value=j.desc;pv();
 msg(j.blocked?(j.apiError?'API xətası: '+j.apiError:'Sayt məlumat vermədi (giriş/captcha). Çin adını və qiyməti əl ilə yapışdırın.'):((j.via==='api'?'Gətirildi (API)':'Gətirildi')+(j.cnyMax>j.cny?'. Diqqət: variantların qiyməti fərqlidir ('+j.cny+' – '+j.cnyMax+' ¥), saytda ən aşağı qiymət göstəriləcək':'')))}catch(e){msg(e.message)}}
async function tz(){const t=$('zh').value.trim();if(!t)return;try{$('az').value=(await api('/translate',{method:'POST',body:{text:t}})).text}catch(e){msg(e.message)}}
function pv(){const p={cny:+$('cn').value||0,kg:+$('kg').value||0.5,pr:+$('pr').value||0};$('pvv').textContent=p.cny||p.pr?fp(p).toFixed(2)+' ₼':'—'}
function rs(){ED=null;$('ft').textContent='Yeni məhsul';for(const k of['lk','zh','az','im','cn','pr','ds','ims','op'])$(k).value='';$('kg').value=.5;pv()}
function ed(id){const p=PR.find(x=>x.id===id);ED=id;$('ft').textContent='Redaktə';$('lk').value=p.link;$('zh').value=p.zh;$('az').value=p.az;$('cat').value=p.c;$('im').value=p.img;$('cn').value=p.cny||'';$('kg').value=p.kg;$('pr').value=p.pr||'';$('ds').value=p.desc||'';$('ims').value=(p.imgs||[]).join('\n');$('op').value=(p.opts||[]).map(o=>o.n+': '+o.v.join(', ')).join('\n');pv();tab('a')}
async function sv(){const b={desc:$('ds').value.trim(),imgs:$('ims').value.split('\n').map(x=>x.trim()).filter(Boolean),opts:$('op').value.split('\n').map(l=>{const i=l.indexOf(':');return{n:l.slice(0,i).trim(),v:l.slice(i+1).split(',').map(x=>x.trim()).filter(Boolean)}}).filter(o=>o.n&&o.v.length),link:$('lk').value.trim(),zh:$('zh').value.trim(),az:$('az').value.trim(),c:$('cat').value,img:$('im').value.trim(),cny:+$('cn').value||0,kg:+$('kg').value||0.5,pr:+$('pr').value||0};
 if(!b.link||!(b.az||b.zh)||!(b.cny||b.pr))return msg('Link, ad və qiymət lazımdır');
 try{await api('/admin/products'+(ED?'/'+ED:''),{method:ED?'PUT':'POST',body:b});PR=(await api('/admin/products')).list;rp();rs();tab('p');msg('Saytda yerləşdirildi')}catch(e){msg(e.message)}}
async function dl(id){if(!confirm('Məhsul silinsin?'))return;try{await api('/admin/products/'+id,{method:'DELETE'});PR=PR.filter(x=>x.id!==id);rp()}catch(e){msg(e.message)}}
async function tt(){const u=$('tl').value.trim();if(!u)return msg('Link daxil edin');$('tres').textContent='Gözləyin…';try{$('tres').textContent=JSON.stringify(await api('/admin/taobao-test',{method:'POST',body:{url:u}}),null,1)}catch(e){$('tres').textContent=e.message}}
setInterval(()=>{if(T&&!$('ap').hidden)api('/orders').then(j=>{if(j.list.length!==OR.length){OR=j.list;ro();msg('Yeni sifariş!')}}).catch(()=>{})},30000);
if(T)start();
</script></body></html>
